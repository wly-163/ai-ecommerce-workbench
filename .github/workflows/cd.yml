name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploy from repo root. Vercel project Root Directory is already "frontend".
      # Do NOT set working-directory: frontend (would become frontend/frontend).
      - name: Deploy frontend to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    if: vars.BACKEND_URL != ''
    steps:
      # Backend deploys via Railway GitHub integration on push to main.
      - name: Wait for Railway auto-deploy
        run: sleep 90

      - name: Check backend health
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.BACKEND_URL }}/health"; then
              exit 0
            fi
            echo "Retry $i/5..."
            sleep 15
          done
          exit 1
